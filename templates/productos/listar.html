{% extends "layout.html" %}

{% block content %}
<h2 class="mb-3">Productos</h2>

<form method="GET" class="row mb-3">

    <div class="col-md-4">
        <input type="text" name="busqueda" class="form-control" placeholder="Buscar producto" value="{{ request.args.get('busqueda', '') }}">
    </div>

    <div class="col-md-3">
        <select name="categoria" class="form-select">
            <option value="">Todas las categorías</option>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}"
                {% if request.args.get('categoria') == categoria.id|string %}
                    selected
                {% endif %}
                >
                    {{ categoria.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="stock_bajo" value="1" {% if request.args.get('stock_bajo') %}checked{% endif %}>
            <label class="form-check-label">
                Stock bajo
            </label>
        </div>
    </div>

    <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        <a href="{{ url_for('inventario') }}" class="btn btn-secondary w-100">
            Ver todos
        </a>
    </div>

</form>

<table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr class="{% if producto.cantidad < 5 %}table-warning{% endif %}">
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.categoria.nombre }}</td>
            <td>${{ producto.precio }}</td>
            <td>{{ producto.cantidad }}</td>
            <td>
                <a href="{{ url_for('editar_producto', id=producto.id) }}" class="btn btn-sm btn-primary">Editar</a>

                <form action="{{ url_for('eliminar_producto', id=producto.id) }}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-danger"
                    onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
