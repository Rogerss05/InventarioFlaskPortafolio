{% extends "layout.html" %}

{% block content %}
<h2 class="mb-3">Productos</h2>

<table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr class="{% if producto.cantidad < 5 %}table-warning{% endif %}">
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.categoria.nombre }}</td>
            <td>${{ producto.precio }}</td>
            <td>{{ producto.cantidad }}</td>
            <td>
                <a href="{{ url_for('editar_producto', id=producto.id) }}" class="btn btn-sm btn-primary">Editar</a>

                <form action="{{ url_for('eliminar_producto', id=producto.id) }}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-danger"
                    onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
